name: Release

# Publishes a signed desktop release (with updater manifest) and Android APK.
# Trigger: push a tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri -> target
            backend_rust -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libavutil-dev libavcodec-dev libavformat-dev libswscale-dev libmlt-dev melt

      - name: Build backend (sidecar)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd backend_rust
          cargo build --release
          mkdir -p frontend/src-tauri/binaries
          cp target/release/prism-backend-rust frontend/src-tauri/binaries/prism-backend-rust-x86_64-unknown-linux-gnu

      - name: Install frontend deps
        run: |
          cd frontend
          pnpm install

      - name: Build & publish desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLES_TARGETS: ${{ matrix.platform == 'ubuntu-22.04' && 'deb,rpm,appimage' || 'all' }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Prism ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version. The desktop app will auto-update from this release.'
          releaseDraft: false
          includeUpdaterJson: true
          tauriArgs: ${{ matrix.args }}

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend deps
        run: |
          cd frontend
          pnpm install

      - name: Build Android APK
        run: |
          cd frontend
          pnpm tauri android build --apk

      - name: Get app version
        id: version
        run: echo "version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish APK + android-latest.json to release
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH=$(find frontend/src-tauri/gen/android -name '*.apk' | grep -i universal | head -1 || find frontend/src-tauri/gen/android -name '*.apk' | head -1)
          APK_NAME="prism-${{ steps.version.outputs.version }}-android.apk"
          cp "$APK_PATH" "$APK_NAME"
          cat > android-latest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "apk": "https://github.com/VardhmanSurana/Prism/releases/download/$TAG/$APK_NAME",
            "notes": "Prism $TAG"
          }
          EOF
          gh release upload "$TAG" "$APK_NAME" android-latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
