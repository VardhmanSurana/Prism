<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo span {
            color: #666;
            font-size: 0.875rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #333;
        }

        .stat-card h3 {
            color: #888;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #333;
            margin-bottom: 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section h2 {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-ghost {
            background: transparent;
            color: #888;
            border: 1px solid #333;
        }

        .btn-ghost:hover {
            background: #333;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #333;
        }

        th {
            color: #888;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background: #222;
        }

        .role-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .role-admin {
            background: #3b82f620;
            color: #3b82f6;
        }

        .role-user {
            background: #22c5520;
            color: #22c55e;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }

        .modal-content h3 {
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #888;
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f0f;
            color: #fff;
            font-size: 0.875rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .success {
            background: #22c5520;
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error {
            background: #ef444420;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="/prism-logo.png" alt="Prism Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23333%22 width=%22100%22 height=%22100%22 rx=%2220%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2240%22>P</text></svg>'">
                <div>
                    <h1>Prism Admin</h1>
                    <span>Server Management Dashboard</span>
                </div>
            </div>
            <div>
                <button class="btn btn-ghost" onclick="refreshStats()">Refresh</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Photos</h3>
                <div class="value" id="photo-count">-</div>
            </div>
            <div class="stat-card">
                <h3>Users</h3>
                <div class="value" id="user-count">-</div>
            </div>
            <div class="stat-card">
                <h3>Albums</h3>
                <div class="value" id="album-count">-</div>
            </div>
            <div class="stat-card">
                <h3>Server Status</h3>
                <div class="value" id="server-status">-</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2>User Management</h2>
                <button class="btn btn-primary" onclick="showAddUserModal()">Add User</button>
            </div>
            <div id="success-message" class="success"></div>
            <div id="error-message" class="error"></div>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #666;">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <div class="section-header">
                <h2>Server Configuration</h2>
            </div>
            <div style="color: #888; font-size: 0.875rem;">
                <p><strong>Port:</strong> 8269</p>
                <p><strong>Database:</strong> SQLite (WAL mode)</p>
                <p><strong>ML Models:</strong> ONNX Runtime</p>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal" id="add-user-modal">
        <div class="modal-content">
            <h3>Add New User</h3>
            <form id="add-user-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="hideAddUserModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        // Fetch and display stats
        async function refreshStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/health`);
                const data = await response.json();
                
                document.getElementById('photo-count').textContent = data.photos.toLocaleString();
                document.getElementById('user-count').textContent = data.users.toLocaleString();
                document.getElementById('album-count').textContent = data.albums.toLocaleString();
                document.getElementById('server-status').textContent = data.status;
                document.getElementById('server-status').style.color = '#22c55e';
            } catch (error) {
                console.error('Failed to fetch stats:', error);
                document.getElementById('server-status').textContent = 'Error';
                document.getElementById('server-status').style.color = '#ef4444';
            }
        }

        // Fetch and display users
        async function refreshUsers() {
            try {
                const response = await fetch(`${API_BASE}/auth/users`);
                const users = await response.json();
                
                const tbody = document.getElementById('users-table');
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #666;">No users found</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td><span class="role-badge role-${user.role}">${user.role}</span></td>
                        <td>${user.created_at || '-'}</td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteUser(${user.id})" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Failed to fetch users:', error);
                showMessage('Failed to load users', 'error');
            }
        }

        // Show success/error message
        function showMessage(message, type) {
            const successEl = document.getElementById('success-message');
            const errorEl = document.getElementById('error-message');
            
            successEl.style.display = 'none';
            errorEl.style.display = 'none';
            
            if (type === 'success') {
                successEl.textContent = message;
                successEl.style.display = 'block';
            } else {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }
            
            setTimeout(() => {
                successEl.style.display = 'none';
                errorEl.style.display = 'none';
            }, 3000);
        }

        // Show add user modal
        function showAddUserModal() {
            document.getElementById('add-user-modal').classList.add('active');
        }

        // Hide add user modal
        function hideAddUserModal() {
            document.getElementById('add-user-modal').classList.remove('active');
            document.getElementById('add-user-form').reset();
        }

        // Handle add user form submission
        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                role: formData.get('role')
            };

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showMessage('User created successfully', 'success');
                    hideAddUserModal();
                    refreshUsers();
                } else {
                    const error = await response.json();
                    showMessage(error.error || 'Failed to create user', 'error');
                }
            } catch (error) {
                showMessage('Failed to create user', 'error');
            }
        });

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;

            try {
                const response = await fetch(`${API_BASE}/auth/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('User deleted successfully', 'success');
                    refreshUsers();
                } else {
                    showMessage('Failed to delete user', 'error');
                }
            } catch (error) {
                showMessage('Failed to delete user', 'error');
            }
        }

        // Initialize
        refreshStats();
        refreshUsers();
    </script>
</body>
</html>
