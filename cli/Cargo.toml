[package]
name = "prism-cli"
version = "0.1.0"
edition = "2021"
description = "Thin command-line client for the Prism Rust backend (calls the REST API)"

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
comfy-table = "7.1"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
