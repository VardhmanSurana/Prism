<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Media Ingestion Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --color-accent-tint: rgba(59, 130, 246, 0.12);
      --color-link:    #60a5fa;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Prism Engine · Data Lifecycle</p>
    <h1>Media Ingestion &amp; DAG Pipeline</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ingest-title ingest-desc">
      <title id="ingest-title">Prism Media Ingestion Pipeline</title>
      <desc id="ingest-desc">Data flow diagram showing media sources entering the Smart Ingestion Service, splitting into binary storage and EXIF parsing, merging into SQLite, and executing a 4-stage background worker DAG.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="540" rx="12" fill="#0F1115" />

      <!-- CONNECTORS (Drawn before boxes) -->
      <!-- Sources to Ingestion Service (Straight at y=104) -->
      <line x1="280" y1="104" x2="368" y2="104" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Ingestion Service to Binary File Storage (Down & Left) -->
      <path d="M 448,152 V 168 Q 448,176 440,176 H 296 Q 288,176 288,184 V 196" fill="none" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Ingestion Service to EXIF Parser (Down & Right) -->
      <path d="M 544,152 V 168 Q 544,176 552,176 H 664 Q 672,176 672,184 V 196" fill="none" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Binary Storage to SQLite Master (Down & Right) -->
      <path d="M 288,284 V 296 Q 288,304 296,304 H 440 Q 448,304 448,312 V 320" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-muted)" />

      <!-- EXIF Parser to SQLite Master (Down & Left) -->
      <path d="M 672,284 V 296 Q 672,304 664,304 H 552 Q 544,304 544,312 V 320" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-muted)" />

      <!-- SQLite Master to 4-Stage DAG (Vertical at x=496) -->
      <line x1="496" y1="388" x2="496" y2="420" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Connector Labels (Opaque masks with 8px visible gap) -->
      <rect x="300" y="84" width="48" height="12" rx="2" fill="#0F1115" />
      <text x="324" y="93" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">STREAM</text>

      <rect x="344" y="156" width="48" height="12" rx="2" fill="#0F1115" />
      <text x="368" y="165" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">SAVE</text>

      <rect x="580" y="156" width="48" height="12" rx="2" fill="#0F1115" />
      <text x="604" y="165" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">EXTRACT</text>

      <rect x="508" y="396" width="60" height="12" rx="2" fill="#0F1115" />
      <text x="538" y="405" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">TRIGGER DAG</text>

      <!-- NODES -->
      <!-- Node 1: Ingestion Sources -->
      <rect x="40" y="56" width="240" height="96" rx="6" fill="#161A20" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect x="48" y="64" width="36" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.20)" stroke-width="0.8" />
      <text x="66" y="73" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="160" y="98" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ingestion Sources</text>
      <text x="160" y="118" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Local Watch · Camera · Takeout</text>
      <text x="160" y="134" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Continuous Inotify &amp; Batch Expand</text>

      <!-- Node 2: Smart Ingestion Service (Focal Accent) -->
      <rect x="368" y="56" width="256" height="96" rx="8" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1.2" />
      <rect x="376" y="64" width="76" height="12" rx="2" fill="transparent" stroke="rgba(59,130,246,0.40)" stroke-width="0.8" />
      <text x="414" y="73" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">CONTROLLER</text>
      <text x="496" y="98" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Smart Ingestion Service</text>
      <text x="496" y="118" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Stream Validation · Binary SHA256</text>
      <text x="496" y="134" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">MIME Detection &amp; Deduplication Check</text>

      <!-- Node 3: Binary Storage Writer -->
      <rect x="160" y="196" width="256" height="88" rx="6" fill="#161A20" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect x="168" y="204" width="48" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.20)" stroke-width="0.8" />
      <text x="192" y="213" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">STORAGE</text>
      <text x="288" y="238" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Binary Asset Storage</text>
      <text x="288" y="258" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">uploads/YYYY/MM/UUID.ext</text>
      <text x="288" y="272" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Original Bits Preserved Unmodified</text>

      <!-- Node 4: Kamadak EXIF Parser -->
      <rect x="544" y="196" width="256" height="88" rx="6" fill="#161A20" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect x="552" y="204" width="52" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.20)" stroke-width="0.8" />
      <text x="578" y="213" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">METADATA</text>
      <text x="672" y="238" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kamadak EXIF Parser</text>
      <text x="672" y="258" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">GPS Lat/Lon · Camera Model · Date</text>
      <text x="672" y="272" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Color Space, ISO &amp; Shutter Speed</text>

      <!-- Node 5: SQLite Database Master -->
      <rect x="368" y="320" width="256" height="68" rx="6" fill="#161A20" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect x="376" y="328" width="48" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.20)" stroke-width="0.8" />
      <text x="400" y="337" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">DATABASE</text>
      <text x="496" y="354" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">SQLite Photo Record Created</text>
      <text x="496" y="372" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">WAL Mode · UUID PK · Ready for Analysis</text>

      <!-- Node 6: 4-Stage Background Worker DAG -->
      <rect x="40" y="420" width="880" height="64" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      
      <!-- Sub-stage 1: WebP Thumbnails -->
      <rect x="52" y="430" width="204" height="44" rx="4" fill="#161A20" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
      <text x="154" y="448" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="10" font-weight="600" text-anchor="middle">1. WebP Thumbnails</text>
      <text x="154" y="464" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">256px / 1024px Quality Optimized</text>

      <!-- Sub-stage 2: PP-OCRv4 Text -->
      <rect x="272" y="430" width="204" height="44" rx="4" fill="#161A20" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
      <text x="374" y="448" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="10" font-weight="600" text-anchor="middle">2. PP-OCRv4 Neural OCR</text>
      <text x="374" y="464" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Text Detection &amp; FTS5 Indexing</text>

      <!-- Sub-stage 3: SCRFD Face ID -->
      <rect x="492" y="430" width="204" height="44" rx="4" fill="#161A20" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
      <text x="594" y="448" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="10" font-weight="600" text-anchor="middle">3. SCRFD Face Recognition</text>
      <text x="594" y="464" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">ArcFace 512-dim Cosine Cluster</text>

      <!-- Sub-stage 4: SigLIP2 Vector -->
      <rect x="712" y="430" width="196" height="44" rx="4" fill="#161A20" stroke="rgba(59,130,246,0.20)" stroke-width="0.8" />
      <text x="810" y="448" fill="#93c5fd" font-family="'Sora', sans-serif" font-size="10" font-weight="600" text-anchor="middle">4. SigLIP2 Semantic Vector</text>
      <text x="810" y="464" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">768-dim Multimodal Embedding</text>

      <!-- LEGEND STRIP -->
      <line x1="24" y1="500" x2="936" y2="500" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
      <text x="28" y="520" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="512" width="12" height="12" rx="2" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1" />
      <text x="140" y="522" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="9">Primary Pipeline Engine</text>

      <rect x="336" y="512" width="12" height="12" rx="2" fill="#161A20" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <text x="356" y="522" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="9">Extraction / Processing Stage</text>

      <line x1="560" y1="518" x2="584" y2="518" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="596" y="522" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="9">Synchronous Flow</text>

      <line x1="740" y1="518" x2="764" y2="518" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-muted)" />
      <text x="776" y="522" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="9">Asynchronous Resolution</text>
    </svg>
  </div>
</body>
</html>
