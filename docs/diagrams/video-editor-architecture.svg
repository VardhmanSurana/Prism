<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Sora:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="480" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- SHELL CONTAINER -->
      <rect x="30" y="30" width="900" height="420" rx="12" fill="#141820" stroke="rgba(255,255,255,0.08)" />

      <!-- CONNECTORS (Top section communication) -->
      <!-- Left sidebar to Preview -->
      <path d="M 270 140 L 310 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <!-- Preview to Inspector -->
      <path d="M 650 140 L 690 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <!-- Preview down to Timeline -->
      <path d="M 480 250 L 480 280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- TOP SECTION (3 Columns) -->

      <!-- Column 1: Left Tool Rail &amp; Assets -->
      <g transform="translate(50, 50)">
        <rect width="220" height="200" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.08)" />
        <rect x="12" y="12" width="90" height="18" rx="3" fill="rgba(255,255,255,0.05)" />
        <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">TOOL RAIL</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Left Sidebar</text>
        <text x="12" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Asset manager &amp; sources</text>

        <g transform="translate(12, 88)">
          <rect width="196" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="16" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Media Assets (Video/Audio)</text>

          <rect y="28" width="196" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="44" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Text Overlays &amp; Lower Thirds</text>

          <rect y="56" width="196" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="72" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Transitions &amp; Visual FX</text>
        </g>
      </g>

      <!-- Column 2: Center Preview Area (FOCAL) -->
      <g transform="translate(310, 50)">
        <rect width="340" height="200" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="14" y="12" width="100" height="18" rx="3" fill="rgba(59,130,246,0.15)" />
        <text x="19" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">LIVE PREVIEW</text>
        <text x="14" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="700">Video Playback Viewport</text>
        <text x="14" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">WebGL composite · Auto-generated proxies</text>

        <!-- Preview canvas mockup -->
        <rect x="14" y="86" width="312" height="96" rx="6" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />
        <circle cx="170" cy="134" r="16" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5" />
        <polygon points="166,126 178,134 166,142" fill="#60a5fa" />
        <text x="170" y="166" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">60fps Playhead Scrub</text>
      </g>

      <!-- Column 3: Inspector Panel -->
      <g transform="translate(690, 50)">
        <rect width="220" height="200" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.08)" />
        <rect x="12" y="12" width="80" height="18" rx="3" fill="rgba(255,255,255,0.05)" />
        <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">PROPERTIES</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Inspector Panel</text>
        <text x="12" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Clip settings &amp; curves</text>

        <g transform="translate(12, 88)">
          <rect width="196" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="16" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Transform &amp; Crop Keyframes</text>

          <rect y="28" width="196" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="44" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Speed Ramp &amp; Opacity</text>

          <rect y="56" width="196" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="72" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Audio Volume &amp; Pan</text>
        </g>
      </g>

      <!-- BOTTOM SECTION: MULTI-TRACK TIMELINE -->
      <g transform="translate(50, 280)">
        <rect width="860" height="150" rx="8" fill="#161A20" stroke="rgba(168,85,247,0.3)" />
        <rect x="14" y="10" width="110" height="18" rx="3" fill="rgba(168,85,247,0.12)" />
        <text x="19" y="23" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">MULTI-TRACK</text>
        <text x="135" y="24" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Timeline Engine (Cut at Playhead 'S' · Snapping · Bookmarks)</text>

        <!-- Track Rows -->
        <g transform="translate(14, 38)">
          <!-- Video Track 1 -->
          <rect width="100" height="26" rx="3" fill="#20182E" />
          <text x="10" y="17" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">V1 (Video)</text>
          <rect x="110" width="280" height="26" rx="4" fill="#2E2344" stroke="rgba(192,132,252,0.3)" />
          <text x="120" y="17" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="9">clip_001.mp4 [00:00 - 00:15]</text>
          <rect x="400" width="220" height="26" rx="4" fill="#2E2344" stroke="rgba(192,132,252,0.3)" />
          <text x="410" y="17" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="9">clip_002.mp4 [00:15 - 00:27]</text>

          <!-- Audio Track 1 -->
          <rect y="32" width="100" height="26" rx="3" fill="#17222E" />
          <text x="10" y="49" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">A1 (Audio)</text>
          <rect x="110" y="32" width="510" height="26" rx="4" fill="#1C2D3E" stroke="rgba(56,189,248,0.3)" />
          <text x="120" y="49" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="9">background_score.wav ~ waveform audio levels</text>

          <!-- Text Track 1 -->
          <rect y="64" width="100" height="26" rx="3" fill="#162923" />
          <text x="10" y="81" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">T1 (Text)</text>
          <rect x="220" y="64" width="200" height="26" rx="4" fill="#1B382F" stroke="rgba(52,211,153,0.3)" />
          <text x="230" y="81" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="9">Title Overlay: "Summer 2026"</text>
        </g>
      </g>
    </svg>
