<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Video Render &amp; Export Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FFmpeg Backend · Hardware Acceleration</p>
    <h1>Video Export &amp; Audio Muxing Pipeline</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="420" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Top Row: Video Stream) -->
      <path d="M 210 130 L 250 130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <path d="M 430 130 L 470 130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- Video to Muxer (Diagonal / orthogonal down) -->
      <path d="M 650 130 L 690 130 Q 700 130 700 150 L 700 200 L 730 200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- CONNECTORS (Bottom Row: Audio Stream) -->
      <path d="M 210 270 L 470 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />
      <rect x="310" y="262" width="60" height="16" rx="3" fill="#161A20" />
      <text x="340" y="274" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Mix Busses</text>

      <!-- Audio to Muxer -->
      <path d="M 650 270 L 690 270 Q 700 270 700 240 L 700 220 L 730 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />

      <!-- Muxer to Output -->
      <path d="M 850 210 L 870 210" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />

      <!-- STAGE 1: Render Timeline -->
      <g transform="translate(30, 80)">
        <rect width="180" height="100" rx="8" fill="#141820" stroke="rgba(59,130,246,0.25)" />
        <rect x="12" y="12" width="70" height="18" rx="3" fill="rgba(59,130,246,0.12)" />
        <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STAGE 01</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Timeline Render</text>
        <text x="12" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Clip cuts &amp; transitions</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Frame-by-frame raster</text>
      </g>

      <!-- STAGE 2: Color Grade & Transform -->
      <g transform="translate(250, 80)">
        <rect width="180" height="100" rx="8" fill="#141820" stroke="rgba(59,130,246,0.25)" />
        <rect x="12" y="12" width="70" height="18" rx="3" fill="rgba(59,130,246,0.12)" />
        <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STAGE 02</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Color &amp; Effects</text>
        <text x="12" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">LUTs, curves &amp; grades</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Transform keyframing</text>
      </g>

      <!-- STAGE 3: Video Encode -->
      <g transform="translate(470, 80)">
        <rect width="180" height="100" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="12" y="12" width="70" height="18" rx="3" fill="rgba(59,130,246,0.15)" />
        <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STAGE 03</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="700">Video Encoding</text>
        <text x="12" y="70" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">H.264 / H.265 Codec</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Hardware NVENC / VAAPI</text>
      </g>

      <!-- AUDIO TRACK PIPELINE (PARALLEL BOTTOM) -->
      <!-- Audio Source -->
      <g transform="translate(30, 220)">
        <rect width="180" height="100" rx="8" fill="#141820" stroke="rgba(56,189,248,0.25)" />
        <rect x="12" y="12" width="70" height="18" rx="3" fill="rgba(56,189,248,0.12)" />
        <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">AUDIO BUS</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Multi-Track Audio</text>
        <text x="12" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Volume envelopes</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Pan &amp; cross-fades</text>
      </g>

      <!-- Audio Mix & Encode -->
      <g transform="translate(470, 220)">
        <rect width="180" height="100" rx="8" fill="#141820" stroke="rgba(56,189,248,0.25)" />
        <rect x="12" y="12" width="70" height="18" rx="3" fill="rgba(56,189,248,0.12)" />
        <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ENCODE</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Audio Encoding</text>
        <text x="12" y="70" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">AAC / MP3 Stream</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Passthrough option</text>
      </g>

      <!-- MUXER -->
      <g transform="translate(730, 150)">
        <rect width="120" height="120" rx="8" fill="#161A20" stroke="#10b981" stroke-width="1.5" />
        <rect x="12" y="12" width="60" height="18" rx="3" fill="rgba(16,185,129,0.15)" />
        <text x="16" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">MUX</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="700">AV Muxer</text>
        <text x="12" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">MP4 container</text>
        <text x="12" y="90" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Fast-start moov</text>
      </g>

      <!-- EXPORT COMPLETE -->
      <g transform="translate(870, 175)">
        <circle cx="35" cy="35" r="28" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5" />
        <text x="35" y="32" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">✓</text>
        <text x="35" y="46" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="9" text-anchor="middle">Complete</text>
      </g>

      <!-- FOOTER NOTE -->
      <text x="50" y="370" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">PERFORMANCE: Automatically leverages FFmpeg hardware encoders (NVENC, VideoToolbox, VAAPI) when available.</text>
    </svg>
  </div>
</body>
</html>
