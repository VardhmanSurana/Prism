<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Database Schema ERD</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SQLite Schema · Relational Data Model</p>
    <h1>Entity Relationship Architecture</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="520" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Drawn first) -->
      <!-- Photo to PhotoAlbum -->
      <path d="M 330 200 L 250 200" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />
      <!-- PhotoAlbum to Album -->
      <path d="M 130 200 L 70 200 Q 60 200 60 210 L 60 300" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />

      <!-- Photo to Face -->
      <path d="M 450 350 L 450 400" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />

      <!-- Photo to PhotoPerson -->
      <path d="M 570 200 L 650 200" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />
      <!-- PhotoPerson to Person -->
      <path d="M 770 200 L 830 200 Q 840 200 840 210 L 840 300" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />

      <!-- Photo to Event -->
      <path d="M 390 110 L 390 60 Q 390 50 400 50 L 450 50" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-muted)" />

      <!-- Video Projects (Independent table) -->
      <path d="M 800 110 L 800 130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-muted)" />

      <!-- CENTRAL TABLE: PHOTO -->
      <g transform="translate(330, 110)">
        <rect width="240" height="240" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <!-- Header -->
        <rect width="240" height="34" rx="8" fill="#1D2432" />
        <rect x="12" y="8" width="50" height="18" rx="4" fill="rgba(59,130,246,0.2)" />
        <text x="37" y="20" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">TABLE</text>
        <text x="70" y="22" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="700">photos</text>

        <!-- Rows -->
        <text x="14" y="58" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">PK</text>
        <text x="42" y="58" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="11">id</text>
        <text x="170" y="58" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">INTEGER</text>

        <text x="14" y="82" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">UK</text>
        <text x="42" y="82" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="11">uuid</text>
        <text x="170" y="82" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">TEXT</text>

        <text x="42" y="106" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11">filename</text>
        <text x="170" y="106" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">TEXT</text>

        <text x="42" y="130" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11">path</text>
        <text x="170" y="130" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">TEXT</text>

        <text x="42" y="154" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11">file_type</text>
        <text x="170" y="154" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">TEXT</text>

        <text x="42" y="178" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11">date_taken</text>
        <text x="170" y="178" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">DATETIME</text>

        <text x="42" y="202" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11">is_favorite</text>
        <text x="170" y="202" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">BOOLEAN</text>

        <text x="42" y="226" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11">is_locked</text>
        <text x="170" y="226" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">BOOLEAN</text>
      </g>

      <!-- JOIN TABLE: photo_albums -->
      <g transform="translate(130, 155)">
        <rect width="120" height="90" rx="6" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="120" height="24" rx="6" fill="#1A202A" />
        <text x="60" y="16" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">photo_albums</text>
        <text x="12" y="44" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10">FK photo_id</text>
        <text x="12" y="64" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10">FK album_id</text>
        <text x="12" y="80" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">added_at DATETIME</text>
      </g>

      <!-- TABLE: albums -->
      <g transform="translate(30, 300)">
        <rect width="180" height="150" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="180" height="28" rx="8" fill="#1A202A" />
        <text x="90" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">albums</text>
        
        <text x="12" y="48" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9">PK</text>
        <text x="36" y="48" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">id INTEGER</text>
        
        <text x="12" y="70" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">UK</text>
        <text x="36" y="70" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">uuid TEXT</text>
        
        <text x="36" y="92" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">name TEXT</text>
        <text x="36" y="114" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">type TEXT</text>
        <text x="36" y="136" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">photo_count INT</text>
      </g>

      <!-- JOIN TABLE: photo_people -->
      <g transform="translate(650, 155)">
        <rect width="120" height="90" rx="6" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="120" height="24" rx="6" fill="#1A202A" />
        <text x="60" y="16" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">photo_people</text>
        <text x="12" y="44" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10">FK photo_id</text>
        <text x="12" y="64" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="10">FK person_id</text>
        <text x="12" y="80" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">confirmed BOOL</text>
      </g>

      <!-- TABLE: people -->
      <g transform="translate(750, 300)">
        <rect width="180" height="150" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="180" height="28" rx="8" fill="#1A202A" />
        <text x="90" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">people</text>
        
        <text x="12" y="48" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9">PK</text>
        <text x="36" y="48" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">id INTEGER</text>
        
        <text x="12" y="70" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">UK</text>
        <text x="36" y="70" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">uuid TEXT</text>
        
        <text x="36" y="92" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">name TEXT</text>
        <text x="36" y="114" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">face_embedding BLOB</text>
        <text x="36" y="136" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">photo_count INT</text>
      </g>

      <!-- TABLE: faces -->
      <g transform="translate(360, 400)">
        <rect width="180" height="90" rx="6" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="180" height="24" rx="6" fill="#1A202A" />
        <text x="90" y="16" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">faces</text>
        <text x="12" y="42" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9">PK id</text>
        <text x="70" y="42" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="9">FK photo_id</text>
        <text x="12" y="60" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">bbox_rect TEXT</text>
        <text x="12" y="78" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">embedding BLOB (512d)</text>
      </g>

      <!-- TABLE: events -->
      <g transform="translate(460, 25)">
        <rect width="180" height="60" rx="6" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="180" height="22" rx="6" fill="#1A202A" />
        <text x="90" y="15" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">events</text>
        <text x="12" y="40" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">id PK · title · dates</text>
      </g>

      <!-- TABLE: video_projects -->
      <g transform="translate(740, 25)">
        <rect width="190" height="80" rx="6" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect width="190" height="22" rx="6" fill="#1A202A" />
        <text x="95" y="15" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">video_projects</text>
        <text x="12" y="42" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">id PK · title · fps · res</text>
        <text x="12" y="62" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">timeline_data JSON</text>
      </g>
    </svg>
  </div>
</body>
</html>
