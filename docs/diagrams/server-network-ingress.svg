<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingress-title ingress-desc">
      <title id="ingress-title">Server Ingress &amp; Request Routing</title>
      <desc id="ingress-desc">Network traffic flow from client browsers to Axum routes, static files, and SPA fallback.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Sora:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" rx="12" fill="#0F1115"/>
      <rect width="100%" height="100%" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- CONNECTORS -->
      <!-- Ingress Arrow: Clients to Docker Port -->
      <path d="M 230 260 L 330 260" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="242" y="242" width="76" height="18" rx="4" fill="#0F1115"/>
      <text x="280" y="255" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">HTTP :8269</text>

      <!-- Fan-out inside Container to 3 Endpoints -->
      <!-- Top: API Handlers -->
      <path d="M 490 230 Q 550 230 550 170 Q 550 140 600 140 L 620 140"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="520" y="170" width="60" height="18" rx="4" fill="#0F1115"/>
      <text x="550" y="183" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">/api/v1/*</text>

      <!-- Middle: Thumbnails Cache -->
      <path d="M 490 260 L 620 260"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="515" y="248" width="70" height="18" rx="4" fill="#0F1115"/>
      <text x="550" y="261" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">/thumbnails/*</text>

      <!-- Bottom: SPA Fallback -->
      <path d="M 490 290 Q 550 290 550 350 Q 550 380 600 380 L 620 380"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="532" y="325" width="36" height="18" rx="4" fill="#0F1115"/>
      <text x="550" y="338" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">/*</text>

      <!-- LEFT: Client Devices Zone -->
      <g transform="translate(40, 150)">
        <rect width="190" height="220" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="20" y="30" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em">LOCAL NETWORK</text>
        <text x="20" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="16" font-weight="600">Client Devices</text>
        <text x="20" y="78" fill="#6b7280" font-family="'Sora', sans-serif" font-size="11">No app install required</text>

        <rect x="16" y="96" width="158" height="32" rx="4" fill="#1E232B"/>
        <text x="26" y="116" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">📱 Mobile Safari / Chrome</text>

        <rect x="16" y="136" width="158" height="32" rx="4" fill="#1E232B"/>
        <text x="26" y="156" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">💻 Desktop Browsers</text>

        <rect x="16" y="176" width="158" height="32" rx="4" fill="#1E232B"/>
        <text x="26" y="196" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">📟 Tablets &amp; TV Hubs</text>
      </g>

      <!-- MIDDLE: Docker Host Boundary -->
      <g transform="translate(340, 170)">
        <rect width="150" height="180" rx="8" fill="rgba(59, 130, 246, 0.05)" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="16" y="28" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">DOCKER INGRESS</text>
        <text x="16" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Port 8269</text>
        
        <rect x="16" y="72" width="118" height="84" rx="4" fill="#161A20" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="26" y="96" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9.5">HOST: 0.0.0.0</text>
        <text x="26" y="116" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9.5">PORT: 8269</text>
        <text x="26" y="138" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="8.5">Axum Router</text>
      </g>

      <!-- RIGHT: Internal Container Handlers -->
      <!-- Handler 1: REST API -->
      <g transform="translate(630, 80)">
        <rect width="290" height="110" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="20" y="26" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">REST API HANDLERS</text>
        <text x="20" y="48" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Axum Routing Engine</text>
        <text x="20" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">/api/v1/photos · /search · /jobs</text>
        <text x="20" y="90" fill="#6b7280" font-family="'Sora', sans-serif" font-size="10">JWT validation, SQLite WAL query execution</text>
      </g>

      <!-- Handler 2: Static Thumbnails -->
      <g transform="translate(630, 210)">
        <rect width="290" height="96" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="20" y="26" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">STATIC FILE SERVICE</text>
        <text x="20" y="48" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Fast Image Serving</text>
        <text x="20" y="72" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">tower-http ServeDir from /data/thumbnails</text>
      </g>

      <!-- Handler 3: SPA Fallback -->
      <g transform="translate(630, 330)">
        <rect width="290" height="110" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="20" y="26" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">SPA FALLBACK</text>
        <text x="20" y="48" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">index.html Fallthrough</text>
        <text x="20" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Unmatched routes → React Router</text>
        <text x="20" y="90" fill="#6b7280" font-family="'Sora', sans-serif" font-size="10">Enables direct URL navigation across views</text>
      </g>
    </svg>
