<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Frontend Component Hierarchy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">React 18 · Architecture &amp; Tree</p>
    <h1>Frontend Component Hierarchy</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="540" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Drawn first) -->
      <!-- App to Sidebar -->
      <path d="M 430 84 L 140 84 Q 130 84 130 94 L 130 130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-muted)" />
      <!-- App to Header -->
      <path d="M 440 84 L 350 84 Q 340 84 340 94 L 340 130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-muted)" />
      <!-- App to MainContent (Primary flow) -->
      <path d="M 500 84 L 500 130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <!-- App to FloatingActions -->
      <path d="M 570 84 L 790 84 Q 800 84 800 94 L 800 130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-muted)" />

      <!-- MainContent to View Categories (3 fan lines) -->
      <!-- To Category 1 (Core Media) -->
      <path d="M 420 190 L 180 190 Q 170 190 170 200 L 170 240" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />
      <!-- To Category 2 (AI Discovery) -->
      <path d="M 500 190 L 500 240" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />
      <!-- To Category 3 (Vault & Utilities) -->
      <path d="M 580 190 L 800 190 Q 810 190 810 200 L 810 240" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr)" />

      <!-- ROOT NODE: App.tsx -->
      <g transform="translate(380, 24)">
        <rect width="240" height="60" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="1.5" />
        <text x="120" y="27" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ROOT APPLICATION SHELL</text>
        <text x="120" y="47" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="700" text-anchor="middle">App.tsx</text>
      </g>

      <!-- ROW 1: SHELL COMPONENTS -->
      <!-- Sidebar -->
      <g transform="translate(40, 130)">
        <rect width="180" height="60" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <text x="90" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">NAVIGATION</text>
        <text x="90" y="44" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sidebar.tsx</text>
      </g>

      <!-- Header -->
      <g transform="translate(250, 130)">
        <rect width="180" height="60" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <text x="90" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">GLOBAL SEARCH &amp; APPS</text>
        <text x="90" y="44" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Header.tsx</text>
      </g>

      <!-- MainContent (FOCAL NODE) -->
      <g transform="translate(460, 130)">
        <rect width="200" height="60" rx="8" fill="#1D2432" stroke="#3b82f6" stroke-width="2" />
        <text x="100" y="24" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">DYNAMIC VIEW ROUTER</text>
        <text x="100" y="45" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="700" text-anchor="middle">MainContent.tsx</text>
      </g>

      <!-- FloatingActions -->
      <g transform="translate(690, 130)">
        <rect width="220" height="60" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <text x="110" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">QUICK ACTION OVERLAYS</text>
        <text x="110" y="44" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600" text-anchor="middle">FloatingActions.tsx</text>
      </g>

      <!-- ROW 2: VIEW COLUMNS / DOMAINS -->

      <!-- COLUMN 1: Core Media & Editors -->
      <g transform="translate(40, 240)">
        <rect width="270" height="265" rx="10" fill="#141820" stroke="rgba(255,255,255,0.06)" />
        <rect x="12" y="12" width="130" height="18" rx="4" fill="rgba(255,255,255,0.04)" />
        <text x="18" y="25" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">CORE MEDIA VIEWS</text>

        <!-- Cards -->
        <rect x="12" y="38" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">PhotoGrid/</text>
        <text x="24" y="73" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">TanStack Virtualizer · timeline</text>

        <rect x="12" y="92" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="112" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">AlbumsView/</text>
        <text x="24" y="127" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">User &amp; smart album grouping</text>

        <rect x="12" y="146" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="166" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Editor/</text>
        <text x="24" y="181" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Photo retouch &amp; Video NLE</text>

        <rect x="12" y="200" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="220" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">MapView/</text>
        <text x="24" y="235" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Leaflet geospatial cluster map</text>
      </g>

      <!-- COLUMN 2: AI Discovery & Intelligence -->
      <g transform="translate(345, 240)">
        <rect width="270" height="265" rx="10" fill="#141820" stroke="rgba(59,130,246,0.2)" />
        <rect x="12" y="12" width="130" height="18" rx="4" fill="rgba(59,130,246,0.1)" />
        <text x="18" y="25" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">AI INTELLIGENCE</text>

        <!-- Cards -->
        <rect x="12" y="38" width="246" height="48" rx="6" fill="#1A202A" stroke="rgba(59,130,246,0.15)" />
        <text x="24" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">ExploreView/</text>
        <text x="24" y="73" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">SigLIP2 semantic clusters</text>

        <rect x="12" y="92" width="246" height="48" rx="6" fill="#1A202A" stroke="rgba(59,130,246,0.15)" />
        <text x="24" y="112" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">AgentView/</text>
        <text x="24" y="127" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Conversational AI photo curator</text>

        <rect x="12" y="146" width="246" height="48" rx="6" fill="#1A202A" stroke="rgba(59,130,246,0.15)" />
        <text x="24" y="166" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">PeopleView/</text>
        <text x="24" y="181" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Face recognition &amp; person tagging</text>

        <rect x="12" y="200" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="220" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">ProjectsDashboard/</text>
        <text x="24" y="235" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Video composition timeline tracks</text>
      </g>

      <!-- COLUMN 3: Management, Security & Vault -->
      <g transform="translate(650, 240)">
        <rect width="270" height="265" rx="10" fill="#141820" stroke="rgba(255,255,255,0.06)" />
        <rect x="12" y="12" width="130" height="18" rx="4" fill="rgba(255,255,255,0.04)" />
        <text x="18" y="25" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">SECURITY &amp; SYSTEM</text>

        <!-- Cards -->
        <rect x="12" y="38" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">LockedViewAuth/</text>
        <text x="24" y="73" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Argon2id encrypted private vault</text>

        <rect x="12" y="92" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="112" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">TrashView/</text>
        <text x="24" y="127" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Soft-delete with 30-day auto-purge</text>

        <rect x="12" y="146" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="166" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">UtilitiesView/</text>
        <text x="24" y="181" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">System diagnostics &amp; backup sync</text>

        <rect x="12" y="200" width="246" height="48" rx="6" fill="#1A202A" />
        <text x="24" y="220" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">SettingsModal/</text>
        <text x="24" y="235" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">LAN sync, models &amp; preferences</text>
      </g>
    </svg>
  </div>
</body>
</html>
