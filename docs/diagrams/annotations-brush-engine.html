<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Annotations Brush &amp; SVG Filter Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Vector Annotations · Media Physics</p>
    <h1>MS Paint Brush Engine &amp; SVG Filter Parity</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="440" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Drawn first) -->
      <!-- Brushes to Controls -->
      <path d="M 310 220 L 360 220" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- Controls to Render Engine -->
      <path d="M 670 220 L 720 220" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />

      <!-- COLUMN 1: 8 MS PAINT BRUSHES -->
      <g transform="translate(30, 40)">
        <rect width="280" height="360" rx="10" fill="#161A20" stroke="rgba(59,130,246,0.3)" />
        <rect x="14" y="14" width="130" height="20" rx="4" fill="rgba(59,130,246,0.12)" />
        <text x="19" y="28" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">BRUSH PRESETS</text>
        <text x="14" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="600">8 Tactile Media Types</text>

        <!-- 8 brush chips in 2 columns -->
        <g transform="translate(14, 76)">
          <rect width="120" height="36" rx="4" fill="#1D2432" />
          <text x="10" y="22" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Paint Brush</text>

          <rect x="132" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="142" y="22" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Spray Mist</text>

          <rect y="44" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="10" y="66" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Calligraphy 1</text>

          <rect x="132" y="44" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="142" y="66" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Calligraphy 2</text>

          <rect y="88" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="10" y="110" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Chalk Grain</text>

          <rect x="132" y="88" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="142" y="110" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Wax Crayon</text>

          <rect y="132" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="10" y="154" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Oil Drybrush</text>

          <rect x="132" y="132" width="120" height="36" rx="4" fill="#1D2432" />
          <text x="142" y="154" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11">Fine Ink Pen</text>
        </g>

        <!-- Eyebrow info -->
        <text x="14" y="325" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Simulated brush bristle physics</text>
        <text x="14" y="342" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">&amp; dynamic angle orientation</text>
      </g>

      <!-- COLUMN 2: PARAMETRIC CONTROLS -->
      <g transform="translate(360, 40)">
        <rect width="310" height="360" rx="10" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="16" y="16" width="140" height="20" rx="4" fill="rgba(59,130,246,0.15)" />
        <text x="21" y="30" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PARAMETRIC DYNAMICS</text>
        <text x="16" y="60" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="16" font-weight="700">Tactile Brush Controls</text>

        <g transform="translate(16, 76)">
          <rect width="278" height="48" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
          <text x="14" y="20" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">MS Paint Thickness Chips</text>
          <text x="14" y="36" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">2px · 6px · 16px · 36px + 1-80px slider</text>

          <rect y="56" width="278" height="48" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
          <text x="14" y="76" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Spray Particle Dynamics</text>
          <text x="14" y="92" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Radius, spatter density &amp; airbrush decay</text>

          <rect y="112" width="278" height="48" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
          <text x="14" y="132" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Ribbon Chisel Angles</text>
          <text x="14" y="148" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">±45° nibs, taper swell &amp; pressure width</text>

          <rect y="168" width="278" height="48" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
          <text x="14" y="188" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Line Styles &amp; Stippling</text>
          <text x="14" y="204" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Solid · Dashed · Dotted · Dynamic gap</text>
        </g>

        <text x="16" y="338" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Non-destructive parametric vector paths</text>
      </g>

      <!-- COLUMN 3: RENDER ENGINE & SVG FILTER PARITY -->
      <g transform="translate(720, 40)">
        <rect width="210" height="360" rx="10" fill="#141820" stroke="rgba(16,185,129,0.3)" />
        <rect x="14" y="14" width="100" height="20" rx="4" fill="rgba(16,185,129,0.12)" />
        <text x="19" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SVG ENGINE</text>
        
        <text x="14" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Filter Parity Engine</text>
        <text x="14" y="76" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Canvas &amp; Export Parity</text>

        <rect x="14" y="96" width="182" height="74" rx="6" fill="#1A202A" />
        <text x="14" y="118" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Procedural Filters</text>
        <text x="14" y="136" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">feTurbulence noise</text>
        <text x="14" y="152" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">feDisplacementMap</text>

        <rect x="14" y="180" width="182" height="74" rx="6" fill="#1A202A" />
        <text x="14" y="202" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Export Guarantee</text>
        <text x="14" y="220" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Pixel-for-pixel match</text>
        <text x="14" y="236" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Full-resolution scaling</text>

        <rect x="14" y="264" width="182" height="74" rx="6" fill="#1A202A" />
        <text x="14" y="286" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Layer Serialization</text>
        <text x="14" y="304" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">JSON edit manifest</text>
        <text x="14" y="320" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Instant draft recovery</text>
      </g>
    </svg>
  </div>
</body>
</html>
