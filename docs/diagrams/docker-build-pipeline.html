<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Multi-Stage Build Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-rule-solid: rgba(255, 255, 255, 0.18);
      --color-accent:  #3b82f6;
      --color-accent-tint: rgba(59, 130, 246, 0.12);
      --color-link:    #60a5fa;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Container Architecture · Diagram Design</p>
    <h1>Prism Server · Multi-Stage Docker Build</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="docker-build-title docker-build-desc">
      <title id="docker-build-title">Docker Multi-Stage Build Pipeline</title>
      <desc id="docker-build-desc">Three-stage containerized build flow combining Node frontend and Rust backend into a minimal Debian runtime image.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" rx="12" fill="#0F1115"/>
      <rect width="100%" height="100%" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- CONNECTORS (Drawn first so boxes sit on top) -->
      <!-- Path from Stage 1 to Runtime -->
      <path d="M 390 150 Q 450 150 450 210 L 450 260 Q 450 300 510 300 L 530 300"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Path from Stage 2 to Runtime -->
      <path d="M 390 390 Q 450 390 450 350 Q 450 320 510 320 L 530 320"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Label 1: React Assets -->
      <rect x="408" y="195" width="84" height="20" rx="4" fill="#0F1115"/>
      <text x="450" y="209" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">/dist bundle</text>

      <!-- Label 2: Rust Binary -->
      <rect x="402" y="345" width="96" height="20" rx="4" fill="#0F1115"/>
      <text x="450" y="359" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">release binary</text>

      <!-- STAGE 1: Frontend Build Container -->
      <g transform="translate(60, 70)">
        <rect width="330" height="160" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="24" y="32" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em">STAGE 1 · BUILD TIME</text>
        <text x="24" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="600">node:22-slim</text>
        <text x="24" y="80" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10.5">Vite 6 + React 18 + Tailwind</text>
        
        <rect x="24" y="100" width="282" height="40" rx="6" fill="#1E232B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="36" y="125" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="11">pnpm build → /frontend/dist</text>
      </g>

      <!-- STAGE 2: Backend Build Container -->
      <g transform="translate(60, 290)">
        <rect width="330" height="160" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="24" y="32" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em">STAGE 2 · BUILD TIME</text>
        <text x="24" y="58" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="600">rust:1.80-slim-bookworm</text>
        <text x="24" y="80" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10.5">Axum + SQLx + Tokio</text>
        
        <rect x="24" y="100" width="282" height="40" rx="6" fill="#1E232B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="36" y="125" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="11">cargo build --release → binary</text>
      </g>

      <!-- STAGE 3: Runtime Container (Focal Element) -->
      <g transform="translate(530, 70)">
        <!-- Accent Glow / Focal border -->
        <rect width="370" height="380" rx="10" fill="rgba(59, 130, 246, 0.05)" stroke="#3b82f6" stroke-width="1.5"/>
        
        <!-- Header -->
        <text x="28" y="34" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">STAGE 3 · RUNTIME IMAGE (FOCAL)</text>
        <text x="28" y="62" fill="#ffffff" font-family="'Sora', sans-serif" font-size="18" font-weight="600">debian:bookworm-slim</text>
        <text x="28" y="84" fill="#9ca3af" font-family="'Sora', sans-serif" font-size="11.5">Zero compiler overhead · Clean ~140MB container</text>

        <!-- Runtime Component 1: Axum Binary -->
        <g transform="translate(24, 110)">
          <rect width="322" height="66" rx="6" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <text x="18" y="28" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">/app/prism-server</text>
          <text x="18" y="48" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">High-performance async Axum web service</text>
        </g>

        <!-- Runtime Component 2: Frontend Bundle -->
        <g transform="translate(24, 192)">
          <rect width="322" height="66" rx="6" fill="#161A20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <text x="18" y="28" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">/app/frontend/dist/</text>
          <text x="18" y="48" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Pre-compressed SPA assets & index.html</text>
        </g>

        <!-- Runtime Component 3: Persistent Data Volume -->
        <g transform="translate(24, 274)">
          <rect width="322" height="78" rx="6" fill="#1E232B" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" stroke-dasharray="4,4"/>
          <text x="18" y="26" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">MOUNTED VOLUME · /data</text>
          <text x="18" y="46" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">prism.db (WAL) · uploads/ · thumbnails/</text>
          <text x="18" y="64" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9.5">Preserved across container updates & rebuilds</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
