<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Ecosystem Topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --color-accent-tint: rgba(59, 130, 246, 0.12);
      --color-link:    #60a5fa;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Prism Platform · Ecosystem Topology</p>
    <h1>Unified Multi-Surface Architecture</h1>
