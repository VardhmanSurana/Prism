<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism CLI Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Terminal Client · REST Bridge</p>
    <h1>CLI Request &amp; Formatted Output Cycle</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="360" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Drawn first) -->
      <!-- User command to CLI (top outbound) -->
      <path d="M 230 130 L 340 130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <rect x="245" y="112" width="80" height="18" rx="3" fill="#161A20" />
      <text x="285" y="124" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Shell Command</text>

      <!-- CLI to Backend (top outbound) -->
      <path d="M 590 130 L 700 130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <rect x="605" y="112" width="80" height="18" rx="3" fill="#161A20" />
      <text x="645" y="124" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">HTTP REST</text>

      <!-- Backend to CLI (bottom return) -->
      <path d="M 700 220 L 590 220" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
      <rect x="605" y="228" width="80" height="18" rx="3" fill="#161A20" />
      <text x="645" y="240" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">JSON Payload</text>

      <!-- CLI to User (bottom return) -->
      <path d="M 340 220 L 230 220" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
      <rect x="242" y="228" width="86" height="18" rx="3" fill="#161A20" />
      <text x="285" y="240" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Formatted Output</text>

      <!-- COLUMN 1: User / Terminal -->
      <g transform="translate(50, 80)">
        <rect width="180" height="190" rx="10" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect x="14" y="14" width="60" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
        <text x="18" y="27" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">CLIENT</text>
        <text x="14" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="600">Terminal User</text>
        <text x="14" y="76" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Bash / Zsh / Fish</text>
        
        <rect x="14" y="100" width="152" height="66" rx="6" fill="#1A202A" />
        <text x="24" y="122" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">prism status</text>
        <text x="24" y="140" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">prism photos list</text>
        <text x="24" y="156" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">--json | --verbose</text>
      </g>

      <!-- COLUMN 2: prism CLI (FOCAL) -->
      <g transform="translate(340, 80)">
        <rect width="250" height="190" rx="10" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="14" y="14" width="70" height="18" rx="4" fill="rgba(59,130,246,0.15)" />
        <text x="18" y="27" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUST CLI</text>
        <text x="14" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="16" font-weight="700">prism Binary</text>
        <text x="14" y="76" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Thin REST Client (reqwest)</text>

        <rect x="14" y="100" width="222" height="66" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="122" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Table &amp; Tree Renderer</text>
        <text x="24" y="140" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">ANSI colors · JSON pipe</text>
        <text x="24" y="156" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Base URL: 127.0.0.1:8269</text>
      </g>

      <!-- COLUMN 3: Prism Backend -->
      <g transform="translate(700, 80)">
        <rect width="210" height="190" rx="10" fill="#141820" stroke="rgba(16,185,129,0.3)" />
        <rect x="14" y="14" width="70" height="18" rx="4" fill="rgba(16,185,129,0.12)" />
        <text x="18" y="27" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SERVER</text>
        <text x="14" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="600">Prism Server</text>
        <text x="14" y="76" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Axum Web Server (:8269)</text>

        <rect x="14" y="100" width="182" height="66" rx="6" fill="#1A202A" />
        <text x="24" y="122" fill="#e5e7eb" font-family="'Sora', sans-serif" font-size="11" font-weight="600">SQLite + File System</text>
        <text x="24" y="140" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">In-Process AI Pipeline</text>
        <text x="24" y="156" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Photo library &amp; state</text>
      </g>

      <!-- FOOTER NOTE -->
      <text x="50" y="320" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">ENVIRONMENT: PRISM_API_URL overrides the default target. Use --api-url &lt;URL&gt; for remote Prism instances.</text>
    </svg>
  </div>
</body>
</html>
