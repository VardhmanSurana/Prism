<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism AI Engine Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Local-First Inference · Privacy Architecture</p>
    <h1>AI Feature Tiers &amp; Execution Engine</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="480" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Drawn first) -->
      <!-- Tier 1 to Apps -->
      <path d="M 310 160 L 370 160" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <!-- Tier 2 to Apps -->
      <path d="M 310 280 L 370 280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <!-- Tier 3 to Apps -->
      <path d="M 310 400 L 370 400" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- Apps to Destinations -->
      <path d="M 670 240 L 730 240" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- COLUMN 1: 3 TIERS -->

      <!-- Tier 1: In-Process ML -->
      <g transform="translate(40, 40)">
        <rect width="270" height="130" rx="10" fill="#141820" stroke="rgba(59,130,246,0.3)" />
        <rect x="14" y="14" width="80" height="18" rx="4" fill="rgba(59,130,246,0.12)" />
        <text x="18" y="27" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TIER 01</text>
        <text x="14" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">In-Process ML Engine</text>
        <text x="14" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">ONNX Runtime (CPU/GPU)</text>
        
        <rect x="14" y="86" width="242" height="32" rx="4" fill="#1A202A" />
        <text x="24" y="106" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">SigLIP2 · PP-OCR · ArcFace · LaMa</text>
      </g>

      <!-- Tier 2: Local LLM Services -->
      <g transform="translate(40, 190)">
        <rect width="270" height="120" rx="10" fill="#141820" stroke="rgba(168,85,247,0.3)" />
        <rect x="14" y="14" width="80" height="18" rx="4" fill="rgba(168,85,247,0.12)" />
        <text x="18" y="27" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TIER 02</text>
        <text x="14" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Local LLM Services</text>
        <text x="14" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">llama-server (ports 9090/9091)</text>

        <rect x="14" y="84" width="242" height="24" rx="4" fill="#1A202A" />
        <text x="24" y="100" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">Gemma 4 E4B · Gemma 4 Vision</text>
      </g>

      <!-- Tier 3: Background Worker -->
      <g transform="translate(40, 330)">
        <rect width="270" height="110" rx="10" fill="#141820" stroke="rgba(16,185,129,0.3)" />
        <rect x="14" y="14" width="80" height="18" rx="4" fill="rgba(16,185,129,0.12)" />
        <text x="18" y="27" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TIER 03</text>
        <text x="14" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Background Worker</text>
        <text x="14" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Non-blocking async task loop</text>
        <text x="14" y="94" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Automated ingestion &amp; batch runs</text>
      </g>

      <!-- COLUMN 2: PRISM AI HUB (FOCAL COMPONENT) -->
      <g transform="translate(370, 40)">
        <rect width="300" height="400" rx="12" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="20" y="20" width="130" height="20" rx="4" fill="rgba(59,130,246,0.15)" />
        <text x="25" y="34" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">RUST ORCHESTRATOR</text>
        <text x="20" y="66" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="17" font-weight="700">AI Coordinator Service</text>
        <text x="20" y="86" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Opt-in feature flags · In-memory cache</text>

        <!-- Functional modules -->
        <rect x="20" y="110" width="260" height="60" rx="8" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="32" y="132" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Vector Embeddings</text>
        <text x="32" y="150" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">768d SigLIP2 + 512d ArcFace</text>

        <rect x="20" y="180" width="260" height="60" rx="8" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="32" y="202" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Neural Text Detection</text>
        <text x="32" y="220" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">PP-OCRv4 + FTS5 indexing</text>

        <rect x="20" y="250" width="260" height="60" rx="8" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="32" y="272" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Conversational Search</text>
        <text x="32" y="290" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">LLM structured tool calling</text>

        <rect x="20" y="320" width="260" height="60" rx="8" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="32" y="342" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Portrait &amp; Healing</text>
        <text x="32" y="360" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">BiSeNet mask + LaMa inpainting</text>
      </g>

      <!-- COLUMN 3: USER EXPERIENCE & STORAGE -->
      <g transform="translate(730, 40)">
        <rect width="190" height="400" rx="10" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect x="14" y="14" width="90" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
        <text x="18" y="27" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">EXPERIENCES</text>

        <g transform="translate(14, 46)">
          <text x="0" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Explore View</text>
          <text x="0" y="36" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Semantic clusters</text>
          <line x1="0" y1="52" x2="162" y2="52" stroke="rgba(255,255,255,0.06)" />
        </g>

        <g transform="translate(14, 116)">
          <text x="0" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Text Actions</text>
          <text x="0" y="36" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Copy, redact, search</text>
          <line x1="0" y1="52" x2="162" y2="52" stroke="rgba(255,255,255,0.06)" />
        </g>

        <g transform="translate(14, 186)">
          <text x="0" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">People View</text>
          <text x="0" y="36" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Face tags &amp; grouping</text>
          <line x1="0" y1="52" x2="162" y2="52" stroke="rgba(255,255,255,0.06)" />
        </g>

        <g transform="translate(14, 256)">
          <text x="0" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Agent Chat</text>
          <text x="0" y="36" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Natural curation</text>
          <line x1="0" y1="52" x2="162" y2="52" stroke="rgba(255,255,255,0.06)" />
        </g>

        <g transform="translate(14, 326)">
          <text x="0" y="18" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">SQLite Storage</text>
          <text x="0" y="36" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">WAL + FTS5 + Vecs</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
