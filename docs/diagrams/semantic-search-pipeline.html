<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism AI Processing &amp; Vector Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0F1115;
      --color-paper-2: #161A20;
      --color-ink:     #f3f4f6;
      --color-muted:   #9ca3af;
      --color-soft:    #6b7280;
      --color-rule:    rgba(255, 255, 255, 0.08);
      --color-accent:  #3b82f6;
      --font-sans:     'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 980px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Multimodal Indexing · Vector &amp; Text Stores</p>
    <h1>AI Extraction &amp; Embedding Pipeline</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="420" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Top stage horizontal flow) -->
      <path d="M 160 115 L 188 115" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <path d="M 335 115 L 363 115" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <path d="M 510 115 L 538 115" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <path d="M 685 115 L 713 115" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <path d="M 830 115 L 850 115" stroke="#10b981" stroke-width="2" marker-end="url(#arr)" />

      <!-- VERTICAL CONNECTORS (From stages to storage sinks) -->
      <!-- Face Detection to Face DB -->
      <path d="M 260 180 L 260 270" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-down)" />
      <rect x="220" y="215" width="80" height="18" rx="3" fill="#161A20" stroke="rgba(255,255,255,0.05)" />
      <text x="260" y="228" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">512d vectors</text>

      <!-- OCR to FTS5 Index -->
      <path d="M 435 180 L 435 270" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-down)" />
      <rect x="395" y="215" width="80" height="18" rx="3" fill="#161A20" stroke="rgba(255,255,255,0.05)" />
      <text x="435" y="228" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Text tokens</text>

      <!-- SigLIP to Vector DB -->
      <path d="M 610 180 L 610 270" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-down)" />
      <rect x="570" y="215" width="80" height="18" rx="3" fill="#161A20" stroke="rgba(255,255,255,0.05)" />
      <text x="610" y="228" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">768d floats</text>

      <!-- Auto-Enhance to Photo DB -->
      <path d="M 770 180 L 770 270" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-down)" />
      <rect x="730" y="215" width="80" height="18" rx="3" fill="#161A20" stroke="rgba(255,255,255,0.05)" />
      <text x="770" y="228" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Curve JSON</text>

      <!-- ROW 1: PROCESSING STAGES -->

      <!-- STAGE 0: Photo Imported -->
      <g transform="translate(30, 50)">
        <rect width="130" height="130" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect x="12" y="12" width="60" height="16" rx="3" fill="rgba(255,255,255,0.05)" />
        <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">INPUT</text>
        <text x="12" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Photo Imported</text>
        <text x="12" y="76" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">New media hash</text>
        <text x="12" y="94" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Decoded bitmap</text>
      </g>

      <!-- STAGE 1: Face Detection -->
      <g transform="translate(195, 50)">
        <rect width="140" height="130" rx="8" fill="#141820" stroke="rgba(245,158,11,0.25)" />
        <rect x="12" y="12" width="70" height="16" rx="3" fill="rgba(245,158,11,0.12)" />
        <text x="16" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">STAGE 01</text>
        <text x="12" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Face Detection</text>
        <text x="12" y="76" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">SCRFD + ArcFace</text>
        <text x="12" y="94" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Cluster identity</text>
      </g>

      <!-- STAGE 2: OCR Extraction -->
      <g transform="translate(370, 50)">
        <rect width="140" height="130" rx="8" fill="#141820" stroke="rgba(16,185,129,0.25)" />
        <rect x="12" y="12" width="70" height="16" rx="3" fill="rgba(16,185,129,0.12)" />
        <text x="16" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">STAGE 02</text>
        <text x="12" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">OCR Extraction</text>
        <text x="12" y="76" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">PP-OCRv4 ONNX</text>
        <text x="12" y="94" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Bounding rects</text>
      </g>

      <!-- STAGE 3: SigLIP Embedding -->
      <g transform="translate(545, 50)">
        <rect width="140" height="130" rx="8" fill="#141820" stroke="rgba(59,130,246,0.35)" />
        <rect x="12" y="12" width="70" height="16" rx="3" fill="rgba(59,130,246,0.15)" />
        <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">STAGE 03</text>
        <text x="12" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">SigLIP Embedding</text>
        <text x="12" y="76" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">768d Vector Space</text>
        <text x="12" y="94" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Semantic search</text>
      </g>

      <!-- STAGE 4: Auto-Enhance -->
      <g transform="translate(720, 50)">
        <rect width="110" height="130" rx="8" fill="#141820" stroke="rgba(236,72,153,0.25)" />
        <rect x="12" y="12" width="70" height="16" rx="3" fill="rgba(236,72,153,0.12)" />
        <text x="16" y="24" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">STAGE 04</text>
        <text x="12" y="56" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Auto-Enhance</text>
        <text x="12" y="76" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">Color analysis</text>
        <text x="12" y="94" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Preset params</text>
      </g>

      <!-- DONE BADGE -->
      <g transform="translate(855, 80)">
        <circle cx="35" cy="35" r="28" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5" />
        <text x="35" y="32" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">DONE</text>
        <text x="35" y="47" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="10" text-anchor="middle">Ready</text>
      </g>

      <!-- ROW 2: STORAGE DESTINATIONS -->

      <!-- Face DB -->
      <g transform="translate(195, 280)">
        <rect width="140" height="90" rx="8" fill="#161A20" stroke="rgba(245,158,11,0.2)" />
        <rect width="140" height="24" rx="8" fill="#1D2432" />
        <text x="70" y="16" fill="#f59e0b" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Face Database</text>
        <text x="12" y="46" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">faces table</text>
        <text x="12" y="66" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">people cluster</text>
      </g>

      <!-- FTS5 Index -->
      <g transform="translate(370, 280)">
        <rect width="140" height="90" rx="8" fill="#161A20" stroke="rgba(16,185,129,0.2)" />
        <rect width="140" height="24" rx="8" fill="#1D2432" />
        <text x="70" y="16" fill="#10b981" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">FTS5 Full-Text</text>
        <text x="12" y="46" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">photo_text_fts</text>
        <text x="12" y="66" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Token inverted list</text>
      </g>

      <!-- Vector DB -->
      <g transform="translate(545, 280)">
        <rect width="140" height="90" rx="8" fill="#161A20" stroke="rgba(59,130,246,0.25)" />
        <rect width="140" height="24" rx="8" fill="#1D2432" />
        <text x="70" y="16" fill="#60a5fa" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Vector Index</text>
        <text x="12" y="46" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">embeddings BLOB</text>
        <text x="12" y="66" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Cosine sim index</text>
      </g>

      <!-- Photo DB -->
      <g transform="translate(720, 280)">
        <rect width="140" height="90" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.08)" />
        <rect width="140" height="24" rx="8" fill="#1D2432" />
        <text x="70" y="16" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Photo Database</text>
        <text x="12" y="46" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="10">photos table</text>
        <text x="12" y="66" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Auto-adjust state</text>
      </g>
    </svg>
  </div>
</body>
</html>
