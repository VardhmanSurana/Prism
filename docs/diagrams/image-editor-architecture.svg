<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Sora:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="520" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- OUTER CONTAINER: EditingMode.tsx Shell -->
      <rect x="30" y="30" width="900" height="460" rx="12" fill="#141820" stroke="rgba(255,255,255,0.08)" />
      
      <!-- TOP BAR -->
      <g transform="translate(46, 46)">
        <rect width="868" height="54" rx="8" fill="#1A202A" stroke="rgba(255,255,255,0.06)" />
        <rect x="14" y="14" width="70" height="26" rx="4" fill="rgba(59,130,246,0.15)" />
        <text x="49" y="31" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">TOPBAR</text>
        <text x="100" y="32" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Global Action Controls</text>
        
        <rect x="340" y="14" width="300" height="26" rx="4" fill="#141820" />
        <text x="490" y="31" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Undo / Redo · Before/After Split · History Drawer</text>
        
        <rect x="748" y="14" width="106" height="26" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
        <text x="801" y="31" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">Export &amp; C2PA</text>
      </g>

      <!-- CONNECTORS (Workspace flow) -->
      <!-- Sidebar to Active Panel -->
      <path d="M 186 280 L 226 280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />
      <!-- Active Panel to Canvas Viewport -->
      <path d="M 426 280 L 466 280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- WORKSPACE AREA -->
      <!-- Component 1: Sidebar Rail -->
      <g transform="translate(46, 120)">
        <rect width="140" height="350" rx="8" fill="#161A20" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">SIDEBAR RAIL</text>
        <text x="14" y="48" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="700">21 Tool Tabs</text>
        
        <g transform="translate(14, 66)">
          <rect width="112" height="26" rx="4" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1" />
          <text x="10" y="17" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">01 Transform</text>
          
          <rect y="32" width="112" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="48" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">02 Curves</text>
          
          <rect y="60" width="112" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="76" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">03 HSL Wheels</text>
          
          <rect y="88" width="112" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="104" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">04 Layers</text>
          
          <rect y="116" width="112" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="132" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">05 RAW Engine</text>

          <rect y="144" width="112" height="24" rx="4" fill="#1D2432" />
          <text x="10" y="160" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="10">06 Annotations</text>
          
          <text x="10" y="195" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">+ 15 Studio Tools</text>
          <text x="10" y="215" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Plugin Gated</text>
        </g>
      </g>

      <!-- Component 2: Active Panel Host -->
      <g transform="translate(226, 120)">
        <rect width="200" height="350" rx="8" fill="#161A20" stroke="rgba(59,130,246,0.3)" />
        <rect x="14" y="14" width="100" height="18" rx="4" fill="rgba(59,130,246,0.12)" />
        <text x="18" y="27" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PANEL REGISTRY</text>
        <text x="14" y="54" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Active Panel Host</text>
        <text x="14" y="74" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">panelRegistry.tsx router</text>

        <rect x="14" y="90" width="172" height="74" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="112" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Parametric Sliders</text>
        <text x="24" y="130" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Exposure, Contrast, WB</text>
        <text x="24" y="148" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Reactive commit events</text>

        <rect x="14" y="174" width="172" height="74" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="196" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Interactive Visualizers</text>
        <text x="24" y="214" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Curves, Wheels &amp; Meshes</text>
        <text x="24" y="232" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Cubic spline calculation</text>

        <rect x="14" y="258" width="172" height="74" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="280" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="11" font-weight="600">Preset Libraries</text>
        <text x="24" y="298" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">3D LUTs · Film Stock</text>
        <text x="24" y="316" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Live preview thumbnails</text>
      </g>

      <!-- Component 3: Decoupled Viewport (CanvasArea.tsx) -->
      <g transform="translate(466, 120)">
        <rect width="448" height="350" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="16" y="14" width="120" height="18" rx="4" fill="rgba(59,130,246,0.15)" />
        <text x="21" y="27" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">CANVAS VIEWPORT</text>
        <text x="16" y="54" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="15" font-weight="700">Decoupled CanvasArea.tsx</text>
        <text x="16" y="74" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Pixel sync · Zoom 10-500% · Smooth Spacebar pan</text>

        <!-- LivePreviewCanvas -->
        <g transform="translate(16, 92)">
          <rect width="416" height="74" rx="6" fill="#1D2432" stroke="rgba(59,130,246,0.25)" />
          <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">BASE LAYER</text>
          <text x="16" y="44" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">LivePreviewCanvas (GPU Filter Pipeline)</text>
          <text x="16" y="62" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">WebGL &amp; CSS composite · Non-destructive multi-pass shading</text>
        </g>

        <!-- Native CropOverlay -->
        <g transform="translate(16, 176)">
          <rect width="416" height="66" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.06)" />
          <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">COMPOSITION OVERLAY</text>
          <text x="16" y="44" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Native CropOverlay (8 Handles &amp; Scrim)</text>
          <text x="16" y="58" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Aspect locks: 1:1, 3:2, 4:3, 16:9 · Rule-of-Thirds</text>
        </g>

        <!-- Interactive Tool Overlays -->
        <g transform="translate(16, 252)">
          <rect width="416" height="80" rx="6" fill="#1D2432" stroke="rgba(255,255,255,0.06)" />
          <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">INTERACTION OVERLAYS</text>
          <text x="16" y="44" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Tactile Tool Overlays</text>
          <text x="16" y="64" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">MS Paint Annotations · LaMa Inpaint · Magnetic Lasso · Liquify Mesh</text>
        </g>
