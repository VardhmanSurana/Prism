<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Sora:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="480" rx="14" fill="#0F1115" stroke="rgba(255,255,255,0.06)" />

      <!-- CONNECTORS (Drawn first) -->
      <!-- Engine to Manager -->
      <path d="M 170 140 L 220 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- Manager to Scanner -->
      <path d="M 400 140 L 450 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- Scanner to Plugins -->
      <path d="M 640 140 L 700 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" />

      <!-- Scanner down to Anatomy -->
      <path d="M 545 190 L 545 240" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)" />

      <!-- ROW 1: ENGINE &amp; SCANNER -->

      <!-- Box 1: Core Engine -->
      <g transform="translate(30, 90)">
        <rect width="140" height="100" rx="8" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect x="12" y="12" width="70" height="18" rx="3" fill="rgba(255,255,255,0.05)" />
        <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">HOST</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Prism Engine</text>
        <text x="12" y="70" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Axum + React UI</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Desktop &amp; Server</text>
      </g>

      <!-- Box 2: Plugin Manager -->
      <g transform="translate(220, 90)">
        <rect width="180" height="100" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="1.5" />
        <rect x="12" y="12" width="90" height="18" rx="3" fill="rgba(59,130,246,0.15)" />
        <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUST SERVICE</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="700">Plugin Manager</text>
        <text x="12" y="70" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">services/plugins.rs</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Manifest parser &amp; state</text>
      </g>

      <!-- Box 3: Root Scanner -->
      <g transform="translate(450, 90)">
        <rect width="190" height="100" rx="8" fill="#161A20" stroke="#3b82f6" stroke-width="2" />
        <rect x="12" y="12" width="100" height="18" rx="3" fill="rgba(59,130,246,0.15)" />
        <text x="16" y="24" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">AUTO-DISCOVER</text>
        <text x="12" y="52" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="700">plugins/ Scanner</text>
        <text x="12" y="70" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">Filesystem watchdog</text>
        <text x="12" y="86" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">Instant reload on drop</text>
      </g>

      <!-- Box 4: Discovered Studio Packs -->
      <g transform="translate(700, 50)">
        <rect width="230" height="170" rx="10" fill="#141820" stroke="rgba(255,255,255,0.08)" />
        <rect x="12" y="12" width="110" height="18" rx="3" fill="rgba(255,255,255,0.05)" />
        <text x="16" y="24" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">DISCOVERED PACKS</text>
        
        <g transform="translate(12, 38)">
          <rect width="206" height="24" rx="4" fill="#1A202A" />
          <text x="8" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">ai-vision-studio/</text>

          <rect y="28" width="206" height="24" rx="4" fill="#1A202A" />
          <text x="8" y="44" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">creative-color-studio/</text>

          <rect y="56" width="206" height="24" rx="4" fill="#1A202A" />
          <text x="8" y="72" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">retouch-metadata-studio/</text>

          <rect y="84" width="206" height="24" rx="4" fill="#1D2432" stroke="rgba(59,130,246,0.3)" />
          <text x="8" y="100" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">&lt;custom-plugin-id&gt;/</text>
        </g>
      </g>

      <!-- ROW 2: PLUGIN FOLDER ANATOMY -->
      <g transform="translate(30, 240)">
        <rect width="900" height="200" rx="10" fill="#141820" stroke="rgba(192,132,252,0.3)" />
        <rect x="16" y="14" width="160" height="20" rx="4" fill="rgba(192,132,252,0.12)" />
        <text x="21" y="28" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SELF-CONTAINED PACKAGE</text>
        <text x="190" y="28" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Plugin Folder Anatomy &amp; Asset Resolution</text>

        <!-- 5 Anatomy items -->
        <g transform="translate(16, 48)">
          <!-- Item 1 -->
          <rect width="165" height="130" rx="6" fill="#1A202A" stroke="rgba(255,255,255,0.05)" />
          <rect x="10" y="10" width="70" height="18" rx="3" fill="#242B36" />
          <text x="14" y="22" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="9">MANIFEST</text>
          <text x="10" y="50" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">plugin.json</text>
          <text x="10" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">ID, version, name</text>
          <text x="10" y="90" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Tools list &amp; caps</text>
          <text x="10" y="108" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Required manifest</text>

          <!-- Item 2 -->
          <rect x="175" width="165" height="130" rx="6" fill="#1A202A" stroke="rgba(255,255,255,0.05)" />
          <rect x="185" y="10" width="60" height="18" rx="3" fill="#242B36" />
          <text x="189" y="22" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="9">CONFIG</text>
          <text x="185" y="50" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">config.json</text>
          <text x="185" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Enabled state</text>
          <text x="185" y="90" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Sub-features toggle</text>
          <text x="185" y="108" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Runtime options</text>

          <!-- Item 3 -->
          <rect x="350" width="165" height="130" rx="6" fill="#1A202A" stroke="rgba(255,255,255,0.05)" />
          <rect x="360" y="10" width="50" height="18" rx="3" fill="#242B36" />
          <text x="364" y="22" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="9">CODE</text>
          <text x="360" y="50" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">index.ts / UI</text>
          <text x="360" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">React components</text>
          <text x="360" y="90" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">@plugins/* alias</text>
          <text x="360" y="108" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Panel exports</text>

          <!-- Item 4 -->
          <rect x="525" width="165" height="130" rx="6" fill="#1A202A" stroke="rgba(255,255,255,0.05)" />
          <rect x="535" y="10" width="60" height="18" rx="3" fill="#242B36" />
          <text x="539" y="22" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="9">MODELS</text>
          <text x="535" y="50" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">models/ ONNX</text>
          <text x="535" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Neural weights</text>
          <text x="535" y="90" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">ISNet, LaMa, etc.</text>
          <text x="535" y="108" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">LRU memory cache</text>

          <!-- Item 5 -->
          <rect x="700" width="165" height="130" rx="6" fill="#1A202A" stroke="rgba(255,255,255,0.05)" />
          <rect x="710" y="10" width="60" height="18" rx="3" fill="#242B36" />
          <text x="714" y="22" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="9">ASSETS</text>
          <text x="710" y="50" fill="#f3f4f6" font-family="'Sora', sans-serif" font-size="12" font-weight="600">assets/</text>
          <text x="710" y="72" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">LUT .cube tables</text>
          <text x="710" y="90" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">Thumbnails, SVGs</text>
          <text x="710" y="108" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">Direct static endpoints</text>
        </g>
      </g>
    </svg>
